<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2em auto; padding: 0 1em; }
        #output { background: #f5f5f5; border: 1px solid #ccc; padding: 1em; margin-top: 1em; white-space: pre-wrap; }
        button { padding: 0.5em 1em; font-size: 1em; cursor: pointer; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>AJAX + PythonHTML Test</h1>

    <button id="loadTime">Load Server Time</button>
    <button id="postForm">Send POST Data</button>
    <button id="loadQuery">Load with Query String</button>

    <div id="output"></div>
    <div id="error" class="error"></div>

    <script>
        async function call(endpoint, options = {}) {
            const output = document.getElementById("output");
            const error = document.getElementById("error");
            output.textContent = "Loading...";
            error.textContent = "";

            try {
                const res = await fetch(endpoint, options);
                const text = await res.text();
                output.textContent = text;
            } catch (err) {
                error.textContent = "Error: " + err.message;
                output.textContent = "";
            }
        }

        document.getElementById("loadTime").addEventListener("click", () => {
            call("/api.pyhtml");
        });

        document.getElementById("postForm").addEventListener("click", () => {
            call("/api.pyhtml", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "username=AJAXUser&message=Hello+from+AJAX"
            });
        });

        document.getElementById("loadQuery").addEventListener("click", () => {
            call("/api.pyhtml?page=1&limit=10");
        });
    </script>
</body>
</html>
